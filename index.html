<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#742324">
<title>はっちークレーン</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<header><a class="brand" href="./"><span class="brand-icon">H</span><span>はっちークレーン</span></a><div class="header-right"><button id="sound" aria-label="音を切り替え" aria-pressed="false">音 OFF</button><button id="fullscreen" aria-label="全画面表示">全画面 ↗</button></div></header>
<main>
<section class="arcade" aria-label="クレーンゲーム">
<div id="stage"><canvas id="gl" aria-label="はっちーの3Dクレーンゲーム"></canvas><div id="banner" role="status" aria-live="polite"></div><div id="err" role="alert"></div></div>
<div class="console"><div class="guide"><div id="guide">スマホでQRを読み取って参加してね</div></div><details class="local-controls"><summary>この端末で操作</summary><div class="buttons"><button id="play">この端末であそぶ ▶</button></div><div id="screen-controls" class="screen-controls"></div></details></div>
</section>
<aside id="panel">
<section class="phone-card"><h2>QRで参加</h2><p id="network-status" role="status">QRを準備しています…</p><button id="open-room" hidden>もう一度つなぐ</button><div id="room-info" hidden><div id="qr" role="img" aria-label="スマホ参加用QRコード"></div><strong id="room-code"></strong><a id="controller-link" target="_blank" rel="noopener">スマホの操作画面 ↗</a><button id="copy-link">参加リンクをコピー</button></div></section>
<section class="status-card"><div><span class="label">あそんでいる人</span><strong id="now">スタンバイ</strong><span id="left">1人2回</span></div></section>
<section id="queue-card" class="queue-card"><div class="section-heading"><h2>順番待ち</h2><span id="queue-count">0 人</span></div><ol id="queue"></ol></section>
<section class="collection-card"><div class="section-heading"><h2>獲得したはっちー</h2><span id="collection-count">0 / 4</span></div><div id="collection"></div><div id="gets" aria-label="獲得した景品"></div></section>
</aside>
</main>
<script type="module" src="js/screen.js"></script>
</body></html>
