<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#872e31"><title>はっちーのコントローラー</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="controller.css"></head>
<body class="controller"><header><a class="brand" href="./"><span class="brand-icon">H</span><span>はっちークレーン</span></a><span id="room-label" class="room-label"></span></header>
<main class="controller-main">
<section id="load" class="view on"><div class="loading-dot">✦</div><h2>パークにつないでいます…</h2></section>
<section id="unavailable" class="view"><span class="scene-icon">⌁</span><h2>まだ部屋が見つからないよ</h2><p id="unavailable-text">スクリーンのQRを読み取ってね。</p><button id="retry" class="primary">もう一度つなぐ ↻</button></section>
<section id="join-view" class="view"><h2>きみの名前を教えてね。</h2><p>スクリーンにニックネームが表示されます。</p><form id="join-form"><label for="name">ニックネーム</label><input id="name" placeholder="はっちー大好き" maxlength="8" autocomplete="nickname" required><small>8文字まで・本名は使わなくてOK</small><button id="join" class="primary" type="submit">列にならぶ →</button></form></section>
<section id="wait" class="view"><span class="scene-icon">⌛</span><h2 id="wait-position">順番を確認しています</h2><p>きみの番になったら<br>この画面がコントローラーになるよ。</p><button id="leave" class="secondary">列から抜ける</button></section>
<section id="play-view" class="view"><h2 id="instruction">自由に動かそう</h2><p id="remaining"></p><div id="controller-controls"></div><p class="fine">つかむときはスクリーンを見てね！</p></section>
<section id="done" class="view"><span class="scene-icon">★</span><h2>またチャレンジしよう！</h2><p id="last-result"></p><div id="my-collection" class="my-collection"></div><button id="again" class="primary">もう一度ならぶ ↻</button><small>獲得記録はこの端末に保存されます</small></section>
<p id="connection-message" class="connection-message" role="status" aria-live="polite"></p></main><script type="module" src="js/controller.js"></script></body></html>
